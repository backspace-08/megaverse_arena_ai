[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cote-megaverse"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["numpy", "tqdm"]

[project.optional-dependencies]
speed = ["numba>=0.63"]

[tool.setuptools.packages.find]
where = ["src"]
